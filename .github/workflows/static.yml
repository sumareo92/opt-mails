name: Deploy Static Content to Pages

on:
  # Trigger the workflow on pushes to the main branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ... the rest of your file (jobs, etc.)

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Install pnpm so the virtual machine can use it
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 2. Set up Node.js environment
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 3. Install your project dependencies
      - name: Install dependencies
        # This flag tells pnpm it's okay if the lockfile is a bit out of sync
        run: pnpm install --no-frozen-lockfile --ignore-scripts


      # 4. Run the build command you found in package.json
      - name: Build project
        # run: pnpm run build
        run: pnpm --filter "@workspace/optmails" run build

      # 5. Upload the RESULT of the build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Verify if the build outputs to 'artifacts/optmails/dist' 
          # or just 'artifacts/optmails'. If it's the latter, keep it as is.
         path: 'artifacts/optmails/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
