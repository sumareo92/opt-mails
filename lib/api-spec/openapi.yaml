openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: optmails
    description: OptMails newsletter and research sharing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /articles:
    get:
      operationId: listArticles
      tags: [optmails]
      summary: List featured research articles
      responses:
        "200":
          description: Research articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
  /newsletter:
    get:
      operationId: getNewsletter
      tags: [optmails]
      summary: Get the current newsletter issue
      responses:
        "200":
          description: Current newsletter issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterIssue"
  /newsletters:
    get:
      operationId: listNewsletters
      tags: [optmails]
      summary: List published newsletter issues (archive)
      responses:
        "200":
          description: Archived newsletter issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsletterIssue"
  /events:
    get:
      operationId: listEvents
      tags: [optmails]
      summary: List upcoming community events
      responses:
        "200":
          description: Community events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityEvent"
    post:
      operationId: createEvent
      tags: [optmails]
      summary: Announce a new community event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"
  /events/{eventId}/rsvps:
    get:
      operationId: listEventRsvps
      tags: [optmails]
      summary: List RSVPs for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: RSVPs for the event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventRsvp"
    post:
      operationId: createEventRsvp
      tags: [optmails]
      summary: Register an RSVP for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRsvpRequest"
      responses:
        "201":
          description: RSVP recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRsvp"
  /team-members:
    get:
      operationId: listTeamMembers
      tags: [optmails]
      summary: List team members and sponsors
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [optmails]
      summary: Add a team member or sponsor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamMemberRequest"
      responses:
        "201":
          description: Team member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /team-members/{id}:
    patch:
      operationId: updateTeamMember
      tags: [optmails]
      summary: Update a team member or sponsor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamMemberRequest"
      responses:
        "200":
          description: Team member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
    delete:
      operationId: deleteTeamMember
      tags: [optmails]
      summary: Remove a team member or sponsor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Team member deleted
  /donation-methods:
    get:
      operationId: listDonationMethods
      tags: [optmails]
      summary: List configured donation methods
      responses:
        "200":
          description: Donation methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonationMethod"
    post:
      operationId: createDonationMethod
      tags: [optmails]
      summary: Add a donation method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationMethodRequest"
      responses:
        "201":
          description: Method created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationMethod"
  /donation-methods/{id}:
    patch:
      operationId: updateDonationMethod
      tags: [optmails]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationMethodRequest"
      responses:
        "200":
          description: Method updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationMethod"
    delete:
      operationId: deleteDonationMethod
      tags: [optmails]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Method deleted
  /donations:
    get:
      operationId: listDonations
      tags: [optmails]
      responses:
        "200":
          description: Donations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donation"
    post:
      operationId: createDonation
      tags: [optmails]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationRequest"
      responses:
        "201":
          description: Donation logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
  /donations/{id}:
    delete:
      operationId: deleteDonation
      tags: [optmails]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Donation deleted
  /fundraising/campaign:
    get:
      operationId: getFundraisingCampaign
      tags: [optmails]
      summary: Get the current fundraising campaign with progress
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundraisingCampaign"
    put:
      operationId: updateFundraisingCampaign
      tags: [optmails]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFundraisingCampaignRequest"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundraisingCampaign"
  /subscribers:
    get:
      operationId: listSubscribers
      tags: [optmails]
      summary: List newsletter subscribers
      responses:
        "200":
          description: Subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscriber"
    post:
      operationId: createSubscriber
      tags: [optmails]
      summary: Subscribe to the monthly newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriberRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscriber"
  /submissions:
    get:
      operationId: listSubmissions
      tags: [optmails]
      summary: List content and research submissions
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [optmails]
      summary: Submit research or newsletter contribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /submissions/{id}:
    patch:
      operationId: updateSubmission
      tags: [optmails]
      summary: Update submission review status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubmissionRequest"
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /notifications:
    get:
      operationId: listNotifications
      tags: [optmails]
      summary: List newsletter notification activity
      responses:
        "200":
          description: Notification log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/preview-send:
    post:
      operationId: createNotificationPreview
      tags: [optmails]
      summary: Queue a newsletter email notification preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationRequest"
      responses:
        "201":
          description: Notification queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [optmails]
      summary: Get submission and newsletter summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        authors:
          type: string
        summary:
          type: string
        category:
          type: string
        sourceUrl:
          type: string
        issueMonth:
          type: string
        readMinutes:
          type: integer
        featured:
          type: boolean
        createdAt:
          type: string
      required: [id, title, authors, summary, category, sourceUrl, issueMonth, readMinutes, featured, createdAt]
    NewsletterIssue:
      type: object
      properties:
        id:
          type: integer
        month:
          type: string
        title:
          type: string
        editorNote:
          type: string
        status:
          type: string
        articles:
          type: array
          items:
            $ref: "#/components/schemas/Article"
      required: [id, month, title, editorNote, status, articles]
    Subscriber:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        audienceType:
          type: string
        country:
          type: string
        interests:
          type: string
        createdAt:
          type: string
      required: [id, email, name, audienceType, country, interests, createdAt]
    CreateSubscriberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        audienceType:
          type: string
        country:
          type: string
        interests:
          type: string
      required: [email, name, audienceType, country]
    Submission:
      type: object
      properties:
        id:
          type: integer
        submitterName:
          type: string
        email:
          type: string
        institution:
          type: string
        country:
          type: string
        contributionType:
          type: string
        title:
          type: string
        abstract:
          type: string
        link:
          type: string
        status:
          type: string
        reviewerNote:
          type: string
        createdAt:
          type: string
      required: [id, submitterName, email, institution, country, contributionType, title, abstract, link, status, reviewerNote, createdAt]
    CreateSubmissionRequest:
      type: object
      properties:
        submitterName:
          type: string
        email:
          type: string
          format: email
        institution:
          type: string
        country:
          type: string
        contributionType:
          type: string
        title:
          type: string
        abstract:
          type: string
        link:
          type: string
      required: [submitterName, email, country, contributionType, title, abstract]
    UpdateSubmissionRequest:
      type: object
      properties:
        status:
          type: string
        reviewerNote:
          type: string
      required: [status]
    Notification:
      type: object
      properties:
        id:
          type: integer
        subject:
          type: string
        body:
          type: string
        audienceCount:
          type: integer
        status:
          type: string
        createdAt:
          type: string
      required: [id, subject, body, audienceCount, status, createdAt]
    CreateNotificationRequest:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
      required: [subject, body]
    CommunityEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        eventDate:
          type: string
        endDate:
          type: string
        location:
          type: string
        format:
          type: string
        registrationUrl:
          type: string
        host:
          type: string
        createdAt:
          type: string
      required: [id, title, description, eventDate, endDate, location, format, registrationUrl, host, createdAt]
    CreateEventRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        eventDate:
          type: string
        endDate:
          type: string
        location:
          type: string
        format:
          type: string
        registrationUrl:
          type: string
        host:
          type: string
      required: [title, description, eventDate, location, format, host]
    EventRsvp:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        createdAt:
          type: string
      required: [id, eventId, name, email, role, createdAt]
    CreateEventRsvpRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
      required: [name, email]
    TeamMember:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
        name:
          type: string
        role:
          type: string
        location:
          type: string
        bio:
          type: string
        email:
          type: string
        linkedin:
          type: string
        websiteUrl:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
      required: [id, category, name, role, location, bio, email, linkedin, websiteUrl, sortOrder, createdAt]
    CreateTeamMemberRequest:
      type: object
      properties:
        category:
          type: string
        name:
          type: string
        role:
          type: string
        location:
          type: string
        bio:
          type: string
        email:
          type: string
        linkedin:
          type: string
        websiteUrl:
          type: string
        sortOrder:
          type: integer
      required: [category, name, role]
    DonationMethod:
      type: object
      properties:
        id: { type: integer }
        provider: { type: string }
        label: { type: string }
        url: { type: string }
        instructions: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean }
        createdAt: { type: string }
      required: [id, provider, label, url, instructions, description, sortOrder, active, createdAt]
    CreateDonationMethodRequest:
      type: object
      properties:
        provider: { type: string }
        label: { type: string }
        url: { type: string }
        instructions: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean }
      required: [provider, label]
    Donation:
      type: object
      properties:
        id: { type: integer }
        donorName: { type: string }
        donorEmail: { type: string }
        amountCents: { type: integer }
        currency: { type: string }
        method: { type: string }
        note: { type: string }
        status: { type: string }
        createdAt: { type: string }
      required: [id, donorName, donorEmail, amountCents, currency, method, note, status, createdAt]
    CreateDonationRequest:
      type: object
      properties:
        donorName: { type: string }
        donorEmail: { type: string }
        amountCents: { type: integer }
        currency: { type: string }
        method: { type: string }
        note: { type: string }
        status: { type: string }
      required: [donorName, amountCents]
    FundraisingCampaign:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        goalCents: { type: integer }
        currency: { type: string }
        active: { type: boolean }
        raisedCents: { type: integer }
        donorCount: { type: integer }
        updatedAt: { type: string }
      required: [id, title, description, goalCents, currency, active, raisedCents, donorCount, updatedAt]
    UpdateFundraisingCampaignRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        goalCents: { type: integer }
        currency: { type: string }
        active: { type: boolean }
      required: [title, goalCents, currency]
    DashboardSummary:
      type: object
      properties:
        subscriberCount:
          type: integer
        submissionCount:
          type: integer
        pendingReviewCount:
          type: integer
        acceptedCount:
          type: integer
        countriesReached:
          type: integer
        articleCount:
          type: integer
        recentSubmissions:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
        statusBreakdown:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
            required: [status, count]
      required: [subscriberCount, submissionCount, pendingReviewCount, acceptedCount, countriesReached, articleCount, recentSubmissions, statusBreakdown]
